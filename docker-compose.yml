version: '3'

services:
  development:
    image: node:24.13.0-alpine3.22
    command: sh -c "yarn install && yarn migrations && PORT=5003 yarn dev"
    volumes:
      - ./components:/app/components
      - ./db:/app/db
      - ./next-env.d.ts:/app/next-env.d.ts
      - ./package.json:/app/package.json
      - ./pages:/app/pages
      - ./tsconfig.json:/app/tsconfig.json
      - ./types:/app/types
      - ./utils:/app/utils
      - ./yarn.lock:/app/yarn.lock
      - cache:/usr/local/share/.cache/yarn/v6
      - /app/node_modules
      - .:/app
    ports:
      - 80:5003
    env_file:
      - .env
    working_dir: /app
    restart: unless-stopped

  test_cloud:
    image: node:24.13.0-alpine3.22
    command: sh -c "yarn install && npm run migrations && npm run test"
    ports: 
      - 5005:5004
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./test:/app/test
      - ./jest.config.js:/app/jest.config.js
      - ./db:/app/db
      - ./package.json:/app/package.json
      - ./pages:/app/pages
      - ./tsconfig.json:/app/tsconfig.json
      - ./utils:/app/utils
      - cache:/usr/local/share/.cache/yarn/v6
      - node_modules:/app/node_modules
      
  db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - 5440
    ports:
      - 5440:5432
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: always

  app:
    image: node:24.13.0-alpine3.22
    command: sh -c "yarn install && yarn migrations && PORT=5003 yarn dev"
    volumes:
      - ./components:/app/components
      - ./db:/app/db
      - ./next-env.d.ts:/app/next-env.d.ts
      - ./package.json:/app/package.json
      - ./pages:/app/pages
      - ./tsconfig.json:/app/tsconfig.json
      - ./types:/app/types
      - ./utils:/app/utils
      - ./yarn.lock:/app/yarn.lock
      - cache:/usr/local/share/.cache/yarn/v6
      - /app/node_modules
      - .:/app
    ports:
      - 5003:5003
    depends_on:
      - db
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/postgres
      - ENV=local
    env_file:
      - .env
    working_dir: /app
    restart: always

  db_test:
    image: postgres:17.7
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - 5432
    ports:
      - 5432:5441
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: always
  
  test:
    image: node:24.13.0-alpine3.22
    command: sh -c "yarn install && npm run migrations && npm run test"
    ports: 
      - 5004:5004
    environment:
      DB_URL: postgres://postgres:postgres@db_test:5432/postgres
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./test:/app/test
      - ./jest.config.js:/app/jest.config.js
      - ./db:/app/db
      - ./package.json:/app/package.json
      - ./pages:/app/pages
      - ./tsconfig.json:/app/tsconfig.json
      - ./utils:/app/utils
      - cache:/usr/local/share/.cache/yarn/v6
      - node_modules:/app/node_modules
    depends_on:
      - db_test

volumes:
  dbdata:
  node_modules:
  cache: